<!-- ============================================================
     LOADER for section: GUIDES - HUB
     Paste this ONCE into the Elementor HTML widget on the
     /guides page (replacing its content).
     From then on it pulls the latest "GUIDES - HUB.html" from
     GitHub automatically (~5 min after PUSH-UPDATES.bat).
     Parent section: Full Width, Stretch ON, padding 0,
     Template: Elementor Canvas.
     ============================================================ -->
<div id="frc-load-guides-hub"></div>
<script>
(function () {
  var m = document.getElementById('frc-load-guides-hub');
  if (!m || m.dataset.initialized === '1') return;
  m.dataset.initialized = '1';

  fetch('https://raw.githubusercontent.com/santibraby/formarosacreative.com/main/HTML/Sections/GUIDES%20-%20HUB.html', { cache: 'no-cache' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function (html) {
      m.innerHTML = html;
      // innerHTML does not execute script tags - recreate them so they run
      m.querySelectorAll('script').forEach(function (old) {
        var s = document.createElement('script');
        if (old.src) { s.src = old.src; } else { s.textContent = old.textContent; }
        old.parentNode.replaceChild(s, old);
      });
    })
    .catch(function (e) { console.error('FRC loader (GUIDES - HUB):', e); });
})();
</script>
