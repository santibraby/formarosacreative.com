<!-- ============================================================
     LOADER for section: SUBSCRIBE - 2 - THANKYOU
     Paste this ONCE into the Elementor HTML widget on the
     thank-you page (the page THANKYOU_URL points at in
     SUBSCRIBE - 1 - LANDING.html).
     From then on it pulls the latest "SUBSCRIBE - 2 - THANKYOU.html"
     from GitHub automatically (~5 min after PUSH-UPDATES.bat).
     Parent section: Full Width, Stretch ON, padding 0,
     Template: Elementor Canvas.
     ============================================================ -->
<div id="frc-load-subscribe-thankyou"></div>
<script>
(function () {
  var m = document.getElementById('frc-load-subscribe-thankyou');
  if (!m || m.dataset.initialized === '1') return;
  m.dataset.initialized = '1';

  fetch('https://raw.githubusercontent.com/santibraby/formarosacreative.com/main/HTML/Sections/SUBSCRIBE%20-%202%20-%20THANKYOU.html', { cache: 'no-cache' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function (html) {
      m.innerHTML = html;
      // innerHTML does not execute script tags - recreate them so they run
      m.querySelectorAll('script').forEach(function (old) {
        var s = document.createElement('script');
        if (old.src) { s.src = old.src; } else { s.textContent = old.textContent; }
        old.parentNode.replaceChild(s, old);
      });
    })
    .catch(function (e) { console.error('FRC loader (SUBSCRIBE - THANKYOU):', e); });
})();
</script>
