<!-- ============================================================
     DOWNLOAD PAGE LOADER - shared by every download page.
     Paste this into the Elementor HTML widget on each
     download page (child of Guides, slug "download-<guide-id>",
     e.g. download-texture-maps).

     Nothing to edit per guide: the page reads the guide id from
     its own slug and looks it up in HTML/Guides/GUIDES -
     INDEX.md by itself.

     Parent section: Full Width, Stretch ON, padding 0,
     Template: Elementor Canvas.
     Live ~5 min after PUSH-UPDATES.bat.
     ============================================================ -->
<div id="frc-load-download"></div>
<script>
(function () {
  var m = document.getElementById('frc-load-download');
  if (!m || m.dataset.initialized === '1') return;
  m.dataset.initialized = '1';

  fetch('https://raw.githubusercontent.com/santibraby/formarosacreative.com/main/HTML/Sections/DOWNLOAD%20-%20PAGE.html', { cache: 'no-cache' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function (html) {
      m.innerHTML = html;
      // innerHTML does not execute script tags - recreate them so they run
      m.querySelectorAll('script').forEach(function (old) {
        var s = document.createElement('script');
        if (old.src) { s.src = old.src; } else { s.textContent = old.textContent; }
        old.parentNode.replaceChild(s, old);
      });
    })
    .catch(function (e) { console.error('FRC loader (DOWNLOAD):', e); });
})();
</script>
