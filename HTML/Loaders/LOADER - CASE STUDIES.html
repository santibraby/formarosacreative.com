<!-- ============================================================
     CASE STUDIES PAGE LOADER - paste this ONCE into the
     Elementor HTML widget on the /case-studies page.

     Page setup: new page, slug "case-studies", template
     Elementor Canvas, Full Width, Stretch ON, padding 0.

     Nothing to edit per case study: the page builds itself from
     HTML/Case Studies/CASE STUDIES - INDEX.md (add case studies
     with ADJUST CASE STUDIES in the Articles app, then push).
     Live ~5 min after PUSH-UPDATES.bat.
     ============================================================ -->
<div id="frc-load-cases"></div>
<script>
(function () {
  var m = document.getElementById('frc-load-cases');
  if (!m || m.dataset.initialized === '1') return;
  m.dataset.initialized = '1';

  fetch('https://raw.githubusercontent.com/santibraby/formarosacreative.com/main/HTML/Sections/CASE%20STUDIES%20-%20HUB.html', { cache: 'no-cache' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function (html) {
      m.innerHTML = html;
      // innerHTML does not execute script tags - recreate them so they run
      m.querySelectorAll('script').forEach(function (old) {
        var s = document.createElement('script');
        if (old.src) { s.src = old.src; } else { s.textContent = old.textContent; }
        old.parentNode.replaceChild(s, old);
      });
    })
    .catch(function (e) { console.error('FRC loader (CASE STUDIES):', e); });
})();
</script>
