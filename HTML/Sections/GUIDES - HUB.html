<!-- ============================================================
     Section: GUIDES hub - formarosacreative.com/guides
     Class:   frc-ghub
     Lists EVERY free guide as a card (cover + title + pitch),
     each linking to its own guide page. Generated from
     HTML/Guides/GUIDES - INDEX.md - add a line there and this
     page updates itself.

     Elementor page settings: Elementor Canvas, Full Width,
     Stretch ON, padding 0. Paste LOADER - GUIDES - HUB.html
     into the page's HTML widget.

     [EDIT] SLOT: the title + subline copy below.
     ============================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<section class="frc-ghub" data-frc-ghub aria-label="Free guides">

  <a class="frc-ghub__wordmark" href="https://formarosacreative.com">FORMA ROSA CREATIVE</a>

  <p class="frc-ghub__badge">FREE GUIDES</p>

  <!-- [EDIT] SLOT: title + subline -->
  <h1 class="frc-ghub__title">Guides from the studio.</h1>
  <p class="frc-ghub__subtitle">Practical tools and workflows from the practice - free, straight to your inbox.</p>

  <p class="frc-ghub__note" data-frc-ghub-loading>LOADING GUIDES ...</p>
  <div class="frc-ghub__cards" data-frc-ghub-cards></div>

</section>

<style>
  /* This section IS the whole page - kill any theme/body gap and
     Elementor flex-container default padding so the dark canvas
     runs edge to edge. Safe: the widget is the entire page. */
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    background: #111111 !important;
  }
  .elementor,
  .elementor .e-con,
  .elementor .e-con-inner,
  .elementor-widget-html,
  .elementor-widget-container {
    padding: 0 !important;
    margin: 0 !important;
    max-width: 100% !important;
    width: 100% !important;
  }

  .frc-ghub {
    --bg: #111111;
    --grid-size: 32px;
    --grid-line: rgba(240, 201, 180, 0.05);
    --panel: #171614;
    --card-line: #29251f;
    --peach-100: #F05300;
    --peach-75:  #F07A3C;
    --peach-50:  #F0A178;
    --peach-25:  #F0C9B4;
    --grey-0:    #F0F0F0;
    --ink-dim: rgba(240, 240, 240, 0.5);
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --font-display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --font-serif: Georgia, "Times New Roman", serif;

    position: relative;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    box-sizing: border-box;
    padding: clamp(40px, 6vh, 72px) clamp(20px, 4vw, 40px) clamp(80px, 12vh, 140px);
    text-align: center;
    color: var(--grey-0);
    font-family: var(--font-mono);

    background-color: var(--bg);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: var(--grid-size) var(--grid-size);
  }
  .frc-ghub *,
  .frc-ghub *::before,
  .frc-ghub *::after { box-sizing: border-box; }

  .frc-ghub__wordmark {
    display: inline-block;
    margin: 0 auto clamp(44px, 7vh, 84px);
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(17px, 1.6vw, 22px);
    letter-spacing: 0.18em;
    color: #d4c4b5;
    text-decoration: none;
    transition: color 200ms ease;
  }
  .frc-ghub__wordmark:hover,
  .frc-ghub__wordmark:focus-visible { color: var(--peach-50); outline: none; }

  /* clean rectangle in full-saturation brand orange, dark text */
  .frc-ghub__badge {
    display: table;
    margin: 0 auto clamp(26px, 4vh, 38px);
    padding: 9px 22px;
    background: var(--peach-100);
    font-size: 10px;
    letter-spacing: 0.28em;
    font-weight: 600;
    color: #111111;
  }

  .frc-ghub__title {
    margin: 0 auto;
    max-width: 18ch;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(34px, 4.8vw, 56px);
    line-height: 1.12;
    color: var(--grey-0);
  }
  .frc-ghub__subtitle {
    margin: clamp(16px, 2.4vh, 24px) auto 0;
    max-width: 52ch;
    font-family: var(--font-serif);
    font-style: italic;
    font-size: clamp(15px, 1.5vw, 18px);
    line-height: 1.6;
    color: var(--peach-25);
  }

  .frc-ghub__note {
    margin: clamp(44px, 7vh, 72px) auto 0;
    font-size: 11px;
    letter-spacing: 0.22em;
    color: var(--ink-dim);
  }

  .frc-ghub__cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 300px));
    justify-content: center;
    gap: clamp(16px, 2vw, 28px);
    max-width: 960px;
    margin: clamp(44px, 7vh, 72px) auto 0;
  }
  .frc-ghub__card {
    display: block;
    padding: 14px 14px 18px;
    background: var(--panel);
    border: 1px solid var(--card-line);
    border-radius: 6px;
    text-decoration: none;
    color: inherit;
    text-align: center;
    transition: border-color 200ms ease, transform 200ms ease;
  }
  .frc-ghub__card:hover,
  .frc-ghub__card:focus-visible {
    border-color: var(--peach-50);
    transform: translateY(-3px);
    outline: none;
  }
  .frc-ghub__card-frame {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 5;
    overflow: hidden;
    background: #1a1a1a;
  }
  .frc-ghub__card-img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: saturate(0.95);
    transition: filter 300ms ease;
  }
  .frc-ghub__card:hover .frc-ghub__card-img { filter: saturate(1.05); }
  .frc-ghub__card-title {
    display: block;
    margin-top: 14px;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 19px;
    line-height: 1.3;
    color: var(--grey-0);
  }
  .frc-ghub__card-pitch {
    display: block;
    margin-top: 8px;
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink-dim);
  }
  .frc-ghub__card-cta {
    display: block;
    margin-top: 14px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--peach-25);
  }
  .frc-ghub__card:hover .frc-ghub__card-cta { color: var(--peach-75); }

  @media (prefers-reduced-motion: reduce) {
    .frc-ghub * { transition: none !important; }
    .frc-ghub__card:hover { transform: none; }
  }
  @media (max-width: 719px) {
    .frc-ghub__title { font-size: clamp(30px, 8.5vw, 38px); }
    .frc-ghub__cards { grid-template-columns: 1fr; max-width: 340px; }
  }
</style>

<script>
(function () {
  var widget = document.querySelector('.frc-ghub');
  if (!widget || widget.dataset.initialized === '1') return;
  widget.dataset.initialized = '1';

  var INDEX_URL = 'https://raw.githubusercontent.com/santibraby/formarosacreative.com/main/HTML/Guides/GUIDES%20-%20INDEX.md';

  var cardsBox = widget.querySelector('[data-frc-ghub-cards]');
  var loadingMsg = widget.querySelector('[data-frc-ghub-loading]');

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function parseIndex(text) {
    var out = [];
    text.replace(/\r/g, '').split('\n').forEach(function (line) {
      var t = line.trim();
      if (!t || t.charAt(0) === '#') return;
      var parts = t.split('|').map(function (p) { return p.trim(); });
      if (parts.length < 5) return;
      out.push({ id: parts[0], title: parts[1], pitch: parts[2], link: parts[3], img: parts[4] });
    });
    return out;
  }

  fetch(INDEX_URL, { cache: 'no-cache' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function (text) {
      var guides = parseIndex(text);
      var html = '';
      guides.forEach(function (g) {
        html += '<a class="frc-ghub__card" href="' + esc(g.link) + '">'
          + '<span class="frc-ghub__card-frame">'
          + '<img class="frc-ghub__card-img" src="' + esc(g.img) + '" alt="' + esc(g.title) + '" loading="lazy" decoding="async">'
          + '</span>'
          + '<span class="frc-ghub__card-title">' + esc(g.title) + '</span>'
          + '<span class="frc-ghub__card-pitch">' + esc(g.pitch) + '</span>'
          + '<span class="frc-ghub__card-cta">GET THE FREE GUIDE</span>'
          + '</a>';
      });
      if (cardsBox) cardsBox.innerHTML = html;
      if (loadingMsg) {
        if (guides.length) loadingMsg.remove();
        else loadingMsg.textContent = 'NO GUIDES YET';
      }
    })
    .catch(function (e) {
      if (loadingMsg) loadingMsg.textContent = 'COULD NOT LOAD GUIDES (' + (e && e.message ? e.message : e) + ')';
    });
})();
</script>
