<!-- ============================================================
     Section: CASE STUDIES hub - formarosacreative.com/case-studies
     Class:   frc-cs
     A grid of case-study posters (each deck's first page). Click
     one and the full pdf deck opens in a lightbox - flip through
     the pages right there.

     Generated from HTML/Case Studies/CASE STUDIES - INDEX.md -
     add a line there (ADJUST CASE STUDIES in the Articles app)
     and this page updates itself.

     WordPress page (one time): slug "case-studies", Elementor
     Canvas - paste LOADER - CASE STUDIES.html into its widget.

     [EDIT] SLOT: the title + subline copy below.
     ============================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<section class="frc-cs" data-frc-cs aria-label="Case studies">

  <a class="frc-cs__wordmark" href="https://formarosacreative.com">FORMA ROSA CREATIVE</a>

  <p class="frc-cs__badge">CASE STUDIES</p>

  <!-- [EDIT] SLOT: title + subline -->
  <h1 class="frc-cs__title">Selected work, documented.</h1>
  <p class="frc-cs__subtitle">Full project walkthroughs from the practice. Click a cover to flip through the deck.</p>

  <p class="frc-cs__note" data-frc-cs-loading>LOADING CASE STUDIES ...</p>
  <div class="frc-cs__cards" data-frc-cs-cards></div>

  <!-- lightbox -->
  <div class="frc-cs__lb" data-frc-cs-lb hidden>
    <button class="frc-cs__lb-close" data-frc-cs-close type="button" aria-label="Close">CLOSE  X</button>
    <div class="frc-cs__lb-stage" data-frc-cs-stage>
      <canvas class="frc-cs__lb-canvas" data-frc-cs-canvas></canvas>
      <div class="frc-cs__lb-spin" data-frc-cs-spin hidden></div>
      <p class="frc-cs__lb-msg" data-frc-cs-msg hidden></p>
    </div>
    <div class="frc-cs__lb-nav">
      <button class="frc-cs__lb-arrow" data-frc-cs-prev type="button" aria-label="Previous page">&lt;</button>
      <span class="frc-cs__lb-count" data-frc-cs-count></span>
      <button class="frc-cs__lb-arrow" data-frc-cs-next type="button" aria-label="Next page">&gt;</button>
    </div>
  </div>

</section>

<style>
  /* This section IS the whole page - kill any theme/body gap and
     Elementor flex-container default padding so the dark canvas
     runs edge to edge. Safe: the widget is the entire page. */
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    background: #111111 !important;
  }
  .elementor,
  .elementor .e-con,
  .elementor .e-con-inner,
  .elementor-widget-html,
  .elementor-widget-container {
    padding: 0 !important;
    margin: 0 !important;
    max-width: 100% !important;
    width: 100% !important;
  }

  .frc-cs {
    --bg: #111111;
    --grid-size: 32px;
    --grid-line: rgba(240, 201, 180, 0.05);
    --panel: #171614;
    --card-line: #29251f;
    --peach-100: #F05300;
    --peach-75:  #F07A3C;
    --peach-50:  #F0A178;
    --peach-25:  #F0C9B4;
    --grey-0:    #F0F0F0;
    --ink-dim: rgba(240, 240, 240, 0.5);
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --font-display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --font-serif: Georgia, "Times New Roman", serif;

    position: relative;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    box-sizing: border-box;
    padding: clamp(40px, 6vh, 72px) clamp(20px, 4vw, 40px) clamp(80px, 12vh, 140px);
    text-align: center;
    color: var(--grey-0);
    font-family: var(--font-mono);

    background-color: var(--bg);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: var(--grid-size) var(--grid-size);
  }
  .frc-cs *,
  .frc-cs *::before,
  .frc-cs *::after { box-sizing: border-box; }

  .frc-cs__wordmark {
    display: inline-block;
    margin: 0 auto clamp(44px, 7vh, 84px);
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(17px, 1.6vw, 22px);
    letter-spacing: 0.18em;
    color: #d4c4b5;
    text-decoration: none;
    transition: color 200ms ease;
  }
  .frc-cs__wordmark:hover,
  .frc-cs__wordmark:focus-visible { color: var(--peach-50); outline: none; }

  .frc-cs__badge {
    display: table;
    margin: 0 auto clamp(26px, 4vh, 38px);
    padding: 9px 22px;
    background: var(--peach-100);
    font-size: 10px;
    letter-spacing: 0.28em;
    font-weight: 600;
    color: #111111;
  }

  .frc-cs__title {
    margin: 0 auto;
    max-width: 18ch;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(34px, 4.8vw, 56px);
    line-height: 1.12;
    color: var(--grey-0);
  }
  .frc-cs__subtitle {
    margin: clamp(16px, 2.4vh, 24px) auto 0;
    max-width: 52ch;
    font-family: var(--font-serif);
    font-style: italic;
    font-size: clamp(15px, 1.5vw, 18px);
    line-height: 1.6;
    color: var(--peach-25);
  }

  .frc-cs__note {
    margin: clamp(44px, 7vh, 72px) auto 0;
    font-size: 11px;
    letter-spacing: 0.22em;
    color: var(--ink-dim);
  }

  .frc-cs__cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 380px));
    justify-content: center;
    align-items: start;
    gap: clamp(16px, 2vw, 28px);
    max-width: 1200px;
    margin: clamp(44px, 7vh, 72px) auto 0;
  }
  .frc-cs__card {
    display: block;
    width: 100%;
    padding: 14px 14px 18px;
    background: var(--panel);
    border: 1px solid var(--card-line);
    border-radius: 6px;
    text-align: center;
    cursor: pointer;
    font-family: inherit;
    color: inherit;
    transition: border-color 200ms ease, transform 200ms ease;
  }
  .frc-cs__card:hover,
  .frc-cs__card:focus-visible {
    border-color: var(--peach-50);
    transform: translateY(-3px);
    outline: none;
  }
  .frc-cs__card-img {
    display: block;
    width: 100%;
    height: auto;
    background: #1a1a1a;
    filter: saturate(0.95);
    transition: filter 300ms ease;
  }
  .frc-cs__card:hover .frc-cs__card-img { filter: saturate(1.05); }
  .frc-cs__card-title {
    display: block;
    margin-top: 14px;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 19px;
    line-height: 1.3;
    color: var(--grey-0);
  }
  .frc-cs__card-blurb {
    display: block;
    margin-top: 8px;
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink-dim);
  }
  .frc-cs__card-cta {
    display: block;
    margin-top: 14px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--peach-25);
  }
  .frc-cs__card:hover .frc-cs__card-cta { color: var(--peach-75); }

  /* --- lightbox ------------------------------------------------ */
  .frc-cs__lb {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(17, 17, 17, 0.96);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .frc-cs__lb[hidden] { display: none; }
  .frc-cs__lb-close {
    position: absolute;
    top: 18px;
    right: 22px;
    background: transparent;
    border: none;
    color: var(--peach-25);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.2em;
    cursor: pointer;
  }
  .frc-cs__lb-close:hover { color: var(--peach-75); }
  .frc-cs__lb-stage {
    display: flex;
    align-items: center;
    justify-content: center;
    max-width: 92vw;
    max-height: 80vh;
  }
  .frc-cs__lb-canvas {
    max-width: 92vw;
    max-height: 80vh;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
    /* dark while empty - the rendered pdf page paints its own
       white, so there is no white flash between pages */
    background: #111111;
  }
  .frc-cs__lb-spin {
    width: 30px;
    height: 30px;
    border: 2px solid rgba(240, 240, 240, 0.18);
    border-top-color: #F0F0F0;
    border-radius: 50%;
    animation: frc-cs-rotate 0.8s linear infinite;
  }
  .frc-cs__lb-spin[hidden] { display: none; }
  @keyframes frc-cs-rotate {
    to { transform: rotate(360deg); }
  }
  .frc-cs__lb-msg {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.22em;
    color: var(--ink-dim);
  }
  .frc-cs__lb-nav {
    display: flex;
    align-items: center;
    gap: 22px;
    margin-top: 18px;
  }
  .frc-cs__lb-arrow {
    background: transparent;
    border: 1px solid #29251f;
    border-radius: 3px;
    padding: 8px 16px;
    color: var(--peach-25);
    font-family: var(--font-mono);
    font-size: 13px;
    cursor: pointer;
    transition: border-color 150ms ease, color 150ms ease;
  }
  .frc-cs__lb-arrow:hover { border-color: var(--peach-50); color: var(--peach-50); }
  .frc-cs__lb-count {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--ink-dim);
  }

  /* --- theme armor: the WP theme paints button hovers with its
     own accent color - pin the background and text color of
     every button in this section so it cannot bleed through --- */
  .frc-cs button {
    -webkit-appearance: none;
    appearance: none;
    box-shadow: none !important;
    text-decoration: none !important;
  }
  .frc-cs__card,
  .frc-cs__card:hover,
  .frc-cs__card:focus,
  .frc-cs__card:active {
    background: var(--panel) !important;
    color: var(--grey-0) !important;
  }
  .frc-cs__lb-close,
  .frc-cs__lb-close:hover,
  .frc-cs__lb-close:focus,
  .frc-cs__lb-close:active,
  .frc-cs__lb-arrow,
  .frc-cs__lb-arrow:hover,
  .frc-cs__lb-arrow:focus,
  .frc-cs__lb-arrow:active {
    background: transparent !important;
  }
  .frc-cs__lb-close:hover,
  .frc-cs__lb-close:focus { color: var(--peach-75) !important; }
  .frc-cs__lb-arrow:hover,
  .frc-cs__lb-arrow:focus { color: var(--peach-50) !important; }

  @media (prefers-reduced-motion: reduce) {
    .frc-cs * { transition: none !important; }
    .frc-cs__card:hover { transform: none; }
    .frc-cs__lb-spin { animation: none !important; }
  }
  @media (max-width: 719px) {
    .frc-cs__title { font-size: clamp(30px, 8.5vw, 38px); }
    .frc-cs__cards { grid-template-columns: 1fr; max-width: 380px; }
  }
</style>

<script>
(function () {
  var widget = document.querySelector('.frc-cs');
  if (!widget || widget.dataset.initialized === '1') return;
  widget.dataset.initialized = '1';

  var INDEX_URL = 'https://raw.githubusercontent.com/santibraby/formarosacreative.com/main/HTML/Case%20Studies/CASE%20STUDIES%20-%20INDEX.md';
  var PDFJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  var PDFJS_WORKER_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  var cardsBox = widget.querySelector('[data-frc-cs-cards]');
  var loadingMsg = widget.querySelector('[data-frc-cs-loading]');
  var lb = widget.querySelector('[data-frc-cs-lb]');
  var lbCanvas = widget.querySelector('[data-frc-cs-canvas]');
  var lbMsg = widget.querySelector('[data-frc-cs-msg]');
  var lbCount = widget.querySelector('[data-frc-cs-count]');
  var lbSpin = widget.querySelector('[data-frc-cs-spin]');

  /* count the click - one ping per browser session per page */
  try {
    var vkey = 'frc-visited-' + location.pathname;
    if (!sessionStorage.getItem(vkey)) {
      sessionStorage.setItem(vkey, '1');
      var srcM = location.search.match(/[?&]src=([^&]+)/);
      fetch('https://formarosacreative.com/wp-json/frc/v1/visit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          page: location.pathname,
          src: srcM ? decodeURIComponent(srcM[1]) : ''
        })
      }).catch(function () {});
    }
  } catch (e) {}

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function parseIndex(text) {
    var out = [];
    text.replace(/\r/g, '').split('\n').forEach(function (line) {
      var t = line.trim();
      if (!t || t.charAt(0) === '#') return;
      var parts = t.split('|').map(function (p) { return p.trim(); });
      if (parts.length < 5) return;
      out.push({ id: parts[0], title: parts[1], blurb: parts[2], img: parts[3], pdf: parts[4] });
    });
    return out;
  }

  /* ---- pdf.js, loaded only when a deck is first opened ---- */
  var pdfjsReady = null;
  function loadPdfJs() {
    if (pdfjsReady) return pdfjsReady;
    pdfjsReady = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = PDFJS_URL;
      s.onload = function () {
        try {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_URL;
          resolve(window.pdfjsLib);
        } catch (e) { reject(e); }
      };
      s.onerror = function () { reject(new Error('could not load the pdf viewer')); };
      document.head.appendChild(s);
    });
    return pdfjsReady;
  }

  /* ---- lightbox state ---- */
  var doc = null;
  var pageNum = 1;
  var rendering = false;

  function setSpin(on) {
    if (!lbSpin) return;
    if (on) lbSpin.removeAttribute('hidden');
    else lbSpin.setAttribute('hidden', '');
  }
  function showMsg(t) {
    lbMsg.textContent = t;
    lbMsg.removeAttribute('hidden');
    lbCanvas.setAttribute('hidden', '');
    setSpin(false);
  }
  function showCanvas() {
    lbMsg.setAttribute('hidden', '');
    lbCanvas.removeAttribute('hidden');
    setSpin(false);
  }

  function renderPage() {
    if (!doc || rendering) return;
    rendering = true;
    var dpr = window.devicePixelRatio || 1;
    doc.getPage(pageNum).then(function (page) {
      var maxW = Math.min(window.innerWidth * 0.92, 1400);
      var maxH = window.innerHeight * 0.8;
      var v1 = page.getViewport({ scale: 1 });
      var scale = Math.min(maxW / v1.width, maxH / v1.height);
      var vp = page.getViewport({ scale: scale * dpr });
      /* double buffer: render offscreen first, then swap - the
         old page stays visible, so flips never flash */
      var off = document.createElement('canvas');
      off.width = vp.width;
      off.height = vp.height;
      return page.render({ canvasContext: off.getContext('2d'), viewport: vp }).promise
        .then(function () { return { off: off, vp: vp }; });
    }).then(function (r) {
      lbCanvas.width = r.vp.width;
      lbCanvas.height = r.vp.height;
      lbCanvas.style.width = Math.floor(r.vp.width / dpr) + 'px';
      lbCanvas.style.height = Math.floor(r.vp.height / dpr) + 'px';
      lbCanvas.getContext('2d').drawImage(r.off, 0, 0);
      rendering = false;
      lbCount.textContent = 'PAGE ' + pageNum + ' OF ' + doc.numPages;
      showCanvas();
    }).catch(function (e) {
      rendering = false;
      showMsg('COULD NOT RENDER THE PAGE (' + (e && e.message ? e.message : e) + ')');
    });
  }

  function openDeck(bytes) {
    loadPdfJs().then(function (lib) {
      return lib.getDocument({ data: bytes }).promise;
    }).then(function (d) {
      doc = d;
      pageNum = 1;
      renderPage();
    }).catch(function (e) {
      showMsg('COULD NOT OPEN THE DECK (' + (e && e.message ? e.message : e) + ')');
    });
  }

  function openCase(c) {
    doc = null;
    lbCount.textContent = '';
    lb.removeAttribute('hidden');
    document.body.style.overflow = 'hidden';
    showMsg('LOADING THE DECK ...');
    setSpin(true);
    fetch(c.pdf, { cache: 'force-cache' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.arrayBuffer();
      })
      .then(openDeck)
      .catch(function (e) {
        showMsg('COULD NOT LOAD THE DECK (' + (e && e.message ? e.message : e) + ')');
      });
  }

  function closeLb() {
    lb.setAttribute('hidden', '');
    document.body.style.overflow = '';
    doc = null;
  }

  widget.querySelector('[data-frc-cs-close]').addEventListener('click', closeLb);
  widget.querySelector('[data-frc-cs-prev]').addEventListener('click', function () {
    if (doc && pageNum > 1) { pageNum -= 1; renderPage(); }
  });
  widget.querySelector('[data-frc-cs-next]').addEventListener('click', function () {
    if (doc && pageNum < doc.numPages) { pageNum += 1; renderPage(); }
  });
  lb.addEventListener('click', function (ev) {
    if (ev.target === lb) closeLb();
  });
  document.addEventListener('keydown', function (ev) {
    if (lb.hasAttribute('hidden')) return;
    if (ev.key === 'Escape') closeLb();
    if (ev.key === 'ArrowLeft' && doc && pageNum > 1) { pageNum -= 1; renderPage(); }
    if (ev.key === 'ArrowRight' && doc && pageNum < doc.numPages) { pageNum += 1; renderPage(); }
  });
  window.addEventListener('resize', function () {
    if (!lb.hasAttribute('hidden') && doc) renderPage();
  });

  /* ---- build the grid ---- */
  fetch(INDEX_URL, { cache: 'no-cache' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function (text) {
      var cases = parseIndex(text);
      cardsBox.innerHTML = '';
      cases.forEach(function (c) {
        var card = document.createElement('button');
        card.type = 'button';
        card.className = 'frc-cs__card';
        card.innerHTML = '<img class="frc-cs__card-img" src="' + esc(c.img) + '" alt="' + esc(c.title) + '" loading="lazy" decoding="async">'
          + '<span class="frc-cs__card-title">' + esc(c.title) + '</span>'
          + '<span class="frc-cs__card-blurb">' + esc(c.blurb) + '</span>'
          + '<span class="frc-cs__card-cta">VIEW THE CASE STUDY</span>';
        card.addEventListener('click', function () { openCase(c); });
        cardsBox.appendChild(card);
      });
      if (loadingMsg) {
        if (cases.length) loadingMsg.remove();
        else loadingMsg.textContent = 'NO CASE STUDIES YET';
      }
    })
    .catch(function (e) {
      if (loadingMsg) loadingMsg.textContent = 'COULD NOT LOAD CASE STUDIES (' + (e && e.message ? e.message : e) + ')';
    });
})();
</script>
